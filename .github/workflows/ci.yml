name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oism
          POSTGRES_PASSWORD: oism_password
          POSTGRES_DB: oism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://oism:oism_password@localhost:5432/oism?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_min_32_characters_______
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_characters______
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oism-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oism-frontend/package-lock.json
      - run: npm install
      - run: npm run build
